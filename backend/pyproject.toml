[project]
name = "argws-financial-platform"
version = "1.0.0rc1"
description = "Plataforma SaaS financeira multitenant"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
# Gate de CI focado em erros que quebram execução: sintaxe e nomes indefinidos.
# Regras estilísticas serão tratadas em uma PR dedicada, sem refatoração abrupta.
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[tool.coverage.run]
branch = true
source = ["app"]
