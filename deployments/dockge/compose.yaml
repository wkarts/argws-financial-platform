name: ${COMPOSE_PROJECT_NAME:-argws-financial-platform}

# ARGWS Financial Platform — Dockge / produção por imagens.
# YAML deliberadamente plano: sem anchors, aliases ou merge keys.
# Apenas financial-gateway publica porta no host.
# Serviços internos permanecem acessíveis somente pela rede Docker.

services:
  financial-preflight:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: "no"
    network_mode: none
    env_file:
      - .env
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["python", "-m", "app.preflight"]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-domain-init:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["python", "-m", "app.domain_bootstrap"]
    depends_on:
      financial-preflight:
        condition: service_completed_successfully
    networks:
      - financial-internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-storage-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    network_mode: none
    depends_on:
      financial-domain-init:
        condition: service_completed_successfully
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-postgres:/data/postgres
      - ${FINANCIAL_DATA_ROOT:-.}/data-redis:/data/redis
      - ${FINANCIAL_DATA_ROOT:-.}/data-rabbitmq:/data/rabbitmq
      - ${FINANCIAL_DATA_ROOT:-.}/data-minio:/data/minio
      - ${FINANCIAL_DATA_ROOT:-.}/data-backups:/data/backups
      - ${FINANCIAL_DATA_ROOT:-.}/data-runtime:/data/runtime
      - ${FINANCIAL_DATA_ROOT:-.}/data-celery:/data/celery
      - ${FINANCIAL_DATA_ROOT:-.}/data-prometheus:/data/prometheus
      - ${FINANCIAL_DATA_ROOT:-.}/data-grafana:/data/grafana
      - ${FINANCIAL_DATA_ROOT:-.}/data-monitoring:/data/monitoring
      - ${FINANCIAL_DATA_ROOT:-.}/data-acme:/data/acme
      - ${FINANCIAL_DATA_ROOT:-.}/data-certs:/data/certs
      - ${FINANCIAL_DATA_ROOT:-.}/data-cloudpanel-agent:/data/cloudpanel-agent
      - ${FINANCIAL_DATA_ROOT:-.}/secrets:/secrets
    command:
      - /bin/sh
      - -ec
      - |
          mkdir -p /data/postgres /data/redis /data/rabbitmq /data/minio \
            /data/backups /data/runtime /data/celery /data/prometheus \
            /data/grafana /data/monitoring /data/acme /data/certs \
            /data/cloudpanel-agent /secrets
          touch /secrets/rclone.conf /secrets/backup-age-identity.txt
          chmod 0777 /data/postgres /data/redis /data/rabbitmq /data/minio /data/prometheus /data/grafana
          chmod 0770 /data/backups /data/runtime /data/celery /data/monitoring
          chmod 0750 /data/acme /data/certs /data/cloudpanel-agent
          chmod 0700 /secrets
          chmod 0600 /secrets/rclone.conf /secrets/backup-age-identity.txt
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-monitoring-init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    depends_on:
      financial-storage-init:
        condition: service_completed_successfully
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-monitoring:/config
    command:
      - /bin/sh
      - -ec
      - |
          mkdir -p \
            /config/grafana/provisioning/datasources \
            /config/grafana/provisioning/dashboards \
            /config/grafana/provisioning/plugins \
            /config/grafana/provisioning/alerting
          cat >/config/prometheus.yml <<'EOF'
          global:
            scrape_interval: 15s
            evaluation_interval: 15s
          scrape_configs:
            - job_name: argws-financial-api
              metrics_path: /metrics
              static_configs:
                - targets: ["financial-api:8000"]
          EOF
          cat >/config/grafana/provisioning/datasources/prometheus.yml <<'EOF'
          apiVersion: 1
          datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://financial-prometheus:9090
              isDefault: true
              editable: false
          EOF
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    depends_on:
      financial-storage-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_platform}
      POSTGRES_USER: ${POSTGRES_USER:-financial_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
      TZ: ${APP_TIMEZONE:-America/Bahia}
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB", "-c", "maintenance_work_mem=64MB", "-c", "wal_compression=on"]
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - financial-internal
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    depends_on:
      financial-storage-init:
        condition: service_completed_successfully
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - financial-internal
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine}
    restart: unless-stopped
    depends_on:
      financial-storage-init:
        condition: service_completed_successfully
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-financial}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}
      RABBITMQ_DEFAULT_VHOST: financial
      TZ: ${APP_TIMEZONE:-America/Bahia}
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - financial-internal
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    depends_on:
      financial-storage-init:
        condition: service_completed_successfully
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-financial}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatória}
      MINIO_REGION_NAME: ${S3_REGION:-sa-east-1}
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - financial-internal
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    depends_on:
      financial-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-financial}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatória}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-financial-backups}
    entrypoint:
      - /bin/sh
      - -ec
      - |
          mc alias set local http://financial-minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
          mc mb --ignore-existing "local/$${BACKUP_S3_BUCKET}"
          mc anonymous set none "local/$${BACKUP_S3_BUCKET}"
    networks:
      - financial-internal
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-migrate:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["python", "-m", "app.cli", "migrate-platform"]
    depends_on:
      financial-storage-init:
        condition: service_completed_successfully
      financial-postgres:
        condition: service_healthy
    networks:
      - financial-internal
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-backups:/data/backups
      - ${FINANCIAL_DATA_ROOT:-.}/data-runtime:/data/runtime
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/rclone.conf:/run/secrets/rclone_config:ro
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/backup-age-identity.txt:/run/secrets/backup_age_identity:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-migrate-tenants:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["python", "-m", "app.cli", "migrate-all-tenants"]
    depends_on:
      financial-migrate:
        condition: service_completed_successfully
    networks:
      - financial-internal
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-backups:/data/backups
      - ${FINANCIAL_DATA_ROOT:-.}/data-runtime:/data/runtime
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/rclone.conf:/run/secrets/rclone_config:ro
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/backup-age-identity.txt:/run/secrets/backup_age_identity:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-bootstrap:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["python", "-m", "app.cli", "bootstrap"]
    depends_on:
      financial-migrate-tenants:
        condition: service_completed_successfully
      financial-minio-init:
        condition: service_completed_successfully
      financial-redis:
        condition: service_healthy
      financial-rabbitmq:
        condition: service_healthy
    networks:
      - financial-internal
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-backups:/data/backups
      - ${FINANCIAL_DATA_ROOT:-.}/data-runtime:/data/runtime
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/rclone.conf:/run/secrets/rclone_config:ro
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/backup-age-identity.txt:/run/secrets/backup_age_identity:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-api:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["gunicorn", "app.main:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--workers", "${API_WORKERS:-2}", "--timeout", "120", "--graceful-timeout", "30", "--access-logfile", "-"]
    depends_on:
      financial-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5).read()\""]
      interval: 20s
      timeout: 8s
      retries: 20
      start_period: 30s
    networks:
      - financial-internal
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-backups:/data/backups
      - ${FINANCIAL_DATA_ROOT:-.}/data-runtime:/data/runtime
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/rclone.conf:/run/secrets/rclone_config:ro
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/backup-age-identity.txt:/run/secrets/backup_age_identity:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  financial-worker-default:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "financial.default,financial.provisioning,financial.outbox", "--loglevel=INFO", "--concurrency=${CELERY_DEFAULT_CONCURRENCY:-2}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      financial-api:
        condition: service_healthy
    networks: [financial-internal]
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-backups:/data/backups
      - ${FINANCIAL_DATA_ROOT:-.}/data-runtime:/data/runtime
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/rclone.conf:/run/secrets/rclone_config:ro
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/backup-age-identity.txt:/run/secrets/backup_age_identity:ro
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  financial-worker-billing:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "financial.billing,financial.banking,financial.cnab,financial.reconciliation", "--loglevel=INFO", "--concurrency=${CELERY_BILLING_CONCURRENCY:-2}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      financial-api: {condition: service_healthy}
    networks: [financial-internal]
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-backups:/data/backups
      - ${FINANCIAL_DATA_ROOT:-.}/data-runtime:/data/runtime
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/rclone.conf:/run/secrets/rclone_config:ro
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/backup-age-identity.txt:/run/secrets/backup_age_identity:ro
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  financial-worker-notifications:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "financial.notifications,financial.webhooks", "--loglevel=INFO", "--concurrency=${CELERY_NOTIFICATION_CONCURRENCY:-2}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      financial-api: {condition: service_healthy}
    networks: [financial-internal]
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-backups:/data/backups
      - ${FINANCIAL_DATA_ROOT:-.}/data-runtime:/data/runtime
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/rclone.conf:/run/secrets/rclone_config:ro
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/backup-age-identity.txt:/run/secrets/backup_age_identity:ro
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  financial-worker-backups:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "financial.backups,financial.exports", "--loglevel=INFO", "--concurrency=1", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      financial-api: {condition: service_healthy}
    networks: [financial-internal]
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-backups:/data/backups
      - ${FINANCIAL_DATA_ROOT:-.}/data-runtime:/data/runtime
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/rclone.conf:/run/secrets/rclone_config:ro
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/backup-age-identity.txt:/run/secrets/backup_age_identity:ro
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  financial-beat:
    image: ghcr.io/wkarts/argws-financial-api:latest
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: financial-postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://financial-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
      CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
      S3_ENDPOINT_URL: http://financial-minio:9000
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
      BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
      MAINTENANCE_FILE: /data/runtime/maintenance.flag
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    depends_on:
      financial-api: {condition: service_healthy}
    networks: [financial-internal]
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-backups:/data/backups
      - ${FINANCIAL_DATA_ROOT:-.}/data-runtime:/data/runtime
      - ${FINANCIAL_DATA_ROOT:-.}/data-celery:/var/lib/celery
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/rclone.conf:/run/secrets/rclone_config:ro
      - ${FINANCIAL_DATA_ROOT:-.}/secrets/backup-age-identity.txt:/run/secrets/backup_age_identity:ro
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  financial-web:
    image: ghcr.io/wkarts/argws-financial-web:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      financial-preflight: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [financial-internal]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  financial-prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      financial-monitoring-init: {condition: service_completed_successfully}
      financial-api: {condition: service_healthy}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${FINANCIAL_DATA_ROOT:-.}/data-prometheus:/prometheus
    networks: [financial-internal]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  financial-grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      financial-prometheus: {condition: service_started}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD obrigatória}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://financial-grafana:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-grafana:/var/lib/grafana
      - ${FINANCIAL_DATA_ROOT:-.}/data-monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [financial-internal]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  financial-acme:
    profiles: ["cloudpanel"]
    image: ghcr.io/wkarts/argws-financial-acme:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      financial-storage-init: {condition: service_completed_successfully}
    env_file: [.env]
    environment:
      CF_Token: ${CLOUDFLARE_API_TOKEN:-}
      ACME_DOMAIN: ${ACME_DOMAIN:-finance.argws.com.br}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-false}
      ACME_DNS_SLEEP: ${ACME_DNS_SLEEP:-20}
      ACME_CHECK_INTERVAL_SECONDS: ${ACME_CHECK_INTERVAL_SECONDS:-43200}
    volumes:
      - ${FINANCIAL_DATA_ROOT:-.}/data-acme:/acme.sh
      - ${FINANCIAL_DATA_ROOT:-.}/data-certs:/certs
    networks: [financial-internal]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  financial-cloudpanel-agent:
    profiles: ["cloudpanel"]
    image: ghcr.io/wkarts/argws-financial-cloudpanel-agent:latest
    pull_policy: always
    restart: unless-stopped
    user: "0:0"
    privileged: true
    pid: host
    network_mode: host
    read_only: true
    depends_on:
      financial-acme: {condition: service_started}
    env_file: [.env]
    environment:
      HOST_ROOT: /host
      CERT_DIR: /certs
      STATE_DIR: /state
      CLOUDPANEL_SITE_DOMAIN: ${CLOUDPANEL_SITE_DOMAIN:-finance.argws.com.br}
      CLOUDPANEL_WILDCARD_DOMAIN: ${CLOUDPANEL_WILDCARD_DOMAIN:-*.finance.argws.com.br}
      CLOUDPANEL_SYNC_INTERVAL_SECONDS: ${CLOUDPANEL_SYNC_INTERVAL_SECONDS:-60}
    volumes:
      - /:/host:rw
      - ${FINANCIAL_DATA_ROOT:-.}/data-certs:/certs:rw
      - ${FINANCIAL_DATA_ROOT:-.}/data-cloudpanel-agent:/state:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

  financial-gateway:
    image: ghcr.io/wkarts/argws-financial-gateway:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      financial-api: {condition: service_healthy}
      financial-web: {condition: service_healthy}
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-finance.argws.com.br}
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-control.finance.argws.com.br}
      ADMIN_HOST: ${ADMIN_HOST:-admin.finance.argws.com.br}
      API_HOST: ${API_HOST:-api.finance.argws.com.br}
      DEMO_HOST: ${DEMO_HOST:-demo.finance.argws.com.br}
      TENANT_DOMAIN_ROOT: ${TENANT_DOMAIN_ROOT:-finance.argws.com.br}
    ports:
      - ${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-18800}:80
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header=\"Host: $${API_HOST}\" http://127.0.0.1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [financial-internal]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: local
      options: {max-size: "20m", max-file: "5"}

networks:
  financial-internal:
    driver: bridge