name: ${COMPOSE_PROJECT_NAME:-argws-financial-platform}

x-api-env: &api-env
  APP_NAME: ${APP_NAME:-ARGWS Financial Platform}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_VERSION: ${APP_VERSION:-1.0.0-rc.2}
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Bahia}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY obrigatória}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY obrigatória}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?PLATFORM_DOMAIN obrigatório}
  CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:?CONTROL_PLANE_HOST obrigatório}
  API_HOST: ${API_HOST:?API_HOST obrigatório}
  TENANT_DOMAIN_ROOT: ${TENANT_DOMAIN_ROOT:?TENANT_DOMAIN_ROOT obrigatório}
  PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-${PLATFORM_DOMAIN},${CONTROL_PLANE_HOST},${API_HOST},.${TENANT_DOMAIN_ROOT},localhost,127.0.0.1}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://${PLATFORM_DOMAIN},https://${CONTROL_PLANE_HOST}}
  POSTGRES_HOST: financial-postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-financial_platform}
  POSTGRES_USER: ${POSTGRES_USER:-financial_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
  POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-${POSTGRES_USER:-financial_admin}}
  POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}}
  POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-20}
  POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-20}
  TENANT_DB_PREFIX: ${TENANT_DB_PREFIX:-fin_tenant}
  TENANT_DB_USER_PREFIX: ${TENANT_DB_USER_PREFIX:-fin_t}
  REDIS_URL: redis://financial-redis:6379/0
  REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-300}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-financial}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}@financial-rabbitmq:5672/financial
  CELERY_RESULT_BACKEND: redis://financial-redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
  PROVISIONING_ASYNC: ${PROVISIONING_ASYNC:-true}
  S3_ENDPOINT_URL: http://financial-minio:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-sa-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY obrigatória}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY obrigatória}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX:-financial-tenant}
  PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Administrador da Plataforma}
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL obrigatório}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD obrigatória}
  BOOTSTRAP_DEMO_TENANT: ${BOOTSTRAP_DEMO_TENANT:-false}
  DEMO_TENANT_NAME: ${DEMO_TENANT_NAME:-Empresa Demonstração}
  DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-demo}
  DEMO_TENANT_ADMIN_NAME: ${DEMO_TENANT_ADMIN_NAME:-Administrador Demo}
  DEMO_TENANT_ADMIN_EMAIL: ${DEMO_TENANT_ADMIN_EMAIL:-admin.demo@example.com}
  DEMO_TENANT_ADMIN_PASSWORD: ${DEMO_TENANT_ADMIN_PASSWORD:-}
  CLOUDFLARE_ENABLED: ${CLOUDFLARE_ENABLED:-false}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
  CLOUDFLARE_ZONE_NAME: ${CLOUDFLARE_ZONE_NAME:-}
  CLOUDFLARE_PROXIED: ${CLOUDFLARE_PROXIED:-true}
  CLOUDFLARE_TENANT_RECORD_TARGET: ${CLOUDFLARE_TENANT_RECORD_TARGET:-${PLATFORM_DOMAIN}}
  CLOUDFLARE_PROVISIONING_MODE: ${CLOUDFLARE_PROVISIONING_MODE:-wildcard}
  DOMAIN_RECONCILIATION_TOKEN: ${DOMAIN_RECONCILIATION_TOKEN:?DOMAIN_RECONCILIATION_TOKEN obrigatória}
  SMTP_ENABLED: ${SMTP_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ARGWS Financial Platform}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-30}
  EVOLUTION_ENABLED: ${EVOLUTION_ENABLED:-false}
  EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
  EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-financial-platform}
  EVOLUTION_SEND_TEXT_PATH: ${EVOLUTION_SEND_TEXT_PATH:-/message/sendText/{instance}}
  EVOLUTION_SEND_MEDIA_PATH: ${EVOLUTION_SEND_MEDIA_PATH:-/message/sendMedia/{instance}}
  EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:?EVOLUTION_WEBHOOK_SECRET obrigatória}
  EVOLUTION_TIMEOUT_SECONDS: ${EVOLUTION_TIMEOUT_SECONDS:-30}
  BANKING_WEBHOOK_SECRET: ${BANKING_WEBHOOK_SECRET:?BANKING_WEBHOOK_SECRET obrigatória}
  BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
  BACKUP_DIR: /data/backups
  BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
  BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
  BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
  BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
  BACKUP_COMPRESS_LEVEL: ${BACKUP_COMPRESS_LEVEL:-9}
  BACKUP_ENCRYPTION_RECIPIENT: ${BACKUP_ENCRYPTION_RECIPIENT:-}
  BACKUP_ENCRYPTION_IDENTITY: /run/secrets/backup_age_identity
  MAINTENANCE_FILE: /data/runtime/maintenance.flag
  BACKUP_UPLOAD_S3: ${BACKUP_UPLOAD_S3:-true}
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-financial-backups}
  BACKUP_RCLONE_CONFIG: /run/secrets/rclone_config
  BACKUP_GOOGLE_DRIVE_ENABLED: ${BACKUP_GOOGLE_DRIVE_ENABLED:-false}
  BACKUP_GOOGLE_DRIVE_REMOTE: ${BACKUP_GOOGLE_DRIVE_REMOTE:-gdrive:argws-financial-platform}
  BACKUP_DROPBOX_ENABLED: ${BACKUP_DROPBOX_ENABLED:-false}
  BACKUP_DROPBOX_REMOTE: ${BACKUP_DROPBOX_REMOTE:-dropbox:argws-financial-platform}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-8}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120/minute}
  WEBHOOK_MAX_AGE_SECONDS: ${WEBHOOK_MAX_AGE_SECONDS:-300}
  ALLOW_DEV_TENANT_HEADER: ${ALLOW_DEV_TENANT_HEADER:-false}
  PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}

x-api-common: &api-common
  image: ${BACKEND_IMAGE:-ghcr.io/wkarts/argws-financial-api:${APP_VERSION:-1.0.0-rc.2}}
  pull_policy: ${APP_PULL_POLICY:-always}
  restart: unless-stopped
  environment: *api-env
  networks: [financial-internal]
  volumes:
    - financial-backups:/data/backups
    - financial-runtime:/data/runtime
    - ${RCLONE_CONFIG_PATH:-/opt/argws-financial-platform/secrets/rclone.conf}:/run/secrets/rclone_config:ro
    - ${BACKUP_AGE_IDENTITY_PATH:-/opt/argws-financial-platform/secrets/backup-age-identity.txt}:/run/secrets/backup_age_identity:ro
  security_opt: ["no-new-privileges:true"]

services:
  financial-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_platform}
      POSTGRES_USER: ${POSTGRES_USER:-financial_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
      TZ: ${APP_TIMEZONE:-America/Bahia}
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB", "-c", "maintenance_work_mem=64MB", "-c", "wal_compression=on"]
    volumes: [financial-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [financial-internal]

  financial-redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes: [financial-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [financial-internal]

  financial-rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-financial}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}
      RABBITMQ_DEFAULT_VHOST: financial
    volumes: [financial-rabbitmq:/var/lib/rabbitmq]
    ports: ["${RABBITMQ_MANAGEMENT_BIND_IP:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [financial-internal]

  financial-minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-financial}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatória}
      MINIO_REGION_NAME: ${S3_REGION:-sa-east-1}
    volumes: [financial-minio:/data]
    ports: ["${MINIO_CONSOLE_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [financial-internal]

  financial-minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    depends_on:
      financial-minio: {condition: service_healthy}
    entrypoint:
      - /bin/sh
      - -ec
      - |
          mc alias set local http://financial-minio:9000 "${MINIO_ROOT_USER:-financial}" "${MINIO_ROOT_PASSWORD}"
          mc mb --ignore-existing "local/${BACKUP_S3_BUCKET:-financial-backups}"
          mc anonymous set none "local/${BACKUP_S3_BUCKET:-financial-backups}"
    networks: [financial-internal]

  financial-migrate:
    <<: *api-common
    restart: "no"
    command: ["python", "-m", "app.cli", "migrate-platform"]
    depends_on:
      financial-postgres: {condition: service_healthy}

  financial-migrate-tenants:
    <<: *api-common
    restart: "no"
    command: ["python", "-m", "app.cli", "migrate-all-tenants"]
    depends_on:
      financial-migrate: {condition: service_completed_successfully}

  financial-bootstrap:
    <<: *api-common
    restart: "no"
    command: ["python", "-m", "app.cli", "bootstrap"]
    depends_on:
      financial-migrate-tenants: {condition: service_completed_successfully}
      financial-minio-init: {condition: service_completed_successfully}
      financial-redis: {condition: service_healthy}
      financial-rabbitmq: {condition: service_healthy}

  financial-api:
    <<: *api-common
    command: ["gunicorn", "app.main:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--workers", "${API_WORKERS:-2}", "--timeout", "120", "--graceful-timeout", "30", "--access-logfile", "-"]
    depends_on:
      financial-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5).read()\""]
      interval: 20s
      timeout: 8s
      retries: 20
      start_period: 30s

  financial-worker-default:
    <<: *api-common
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "financial.default,financial.provisioning,financial.outbox", "--loglevel=INFO", "--concurrency=${CELERY_DEFAULT_CONCURRENCY:-2}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      financial-api: {condition: service_healthy}

  financial-worker-billing:
    <<: *api-common
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "financial.billing,financial.banking,financial.cnab,financial.reconciliation", "--loglevel=INFO", "--concurrency=${CELERY_BILLING_CONCURRENCY:-2}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      financial-api: {condition: service_healthy}

  financial-worker-notifications:
    <<: *api-common
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "financial.notifications,financial.webhooks", "--loglevel=INFO", "--concurrency=${CELERY_NOTIFICATION_CONCURRENCY:-2}", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      financial-api: {condition: service_healthy}

  financial-worker-backups:
    <<: *api-common
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-Q", "financial.backups,financial.exports", "--loglevel=INFO", "--concurrency=1", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    depends_on:
      financial-api: {condition: service_healthy}

  financial-beat:
    <<: *api-common
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    volumes:
      - financial-backups:/data/backups
      - financial-runtime:/data/runtime
      - financial-celery:/var/lib/celery
      - ${RCLONE_CONFIG_PATH:-/opt/argws-financial-platform/secrets/rclone.conf}:/run/secrets/rclone_config:ro
      - ${BACKUP_AGE_IDENTITY_PATH:-/opt/argws-financial-platform/secrets/backup-age-identity.txt}:/run/secrets/backup_age_identity:ro
    depends_on:
      financial-api: {condition: service_healthy}

  financial-web:
    image: ${FRONTEND_IMAGE:-ghcr.io/wkarts/argws-financial-web:${APP_VERSION:-1.0.0-rc.2}}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [financial-internal]

  financial-gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/wkarts/argws-financial-gateway:${APP_VERSION:-1.0.0-rc.2}}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      financial-api: {condition: service_healthy}
      financial-web: {condition: service_healthy}
    ports: ["${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8800}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [financial-internal]

networks:
  financial-internal:
    driver: bridge

volumes:
  financial-postgres:
  financial-redis:
  financial-rabbitmq:
  financial-minio:
  financial-backups:
  financial-runtime:
  financial-celery:
