name: Promote Current Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-current-release.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote current version to normal/latest Release
        id: promote
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true

          release_json="$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isDraft,isPrerelease,url,assets)"
          is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          release_url="$(jq -r '.url' <<<"$release_json")"
          asset_count="$(jq '.assets | length' <<<"$release_json")"
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"

          [[ "$is_draft" == "false" ]] || { echo "::error::Release continua Draft"; exit 1; }
          [[ "$is_prerelease" == "false" ]] || { echo "::error::Release continua Pre-release"; exit 1; }
          [[ "$latest_tag" == "$tag" ]] || { echo "::error::Latest é $latest_tag, esperado $tag"; exit 1; }

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "url=$release_url"
            echo "asset_count=$asset_count"
          } >> "$GITHUB_OUTPUT"

      - name: Record promotion proof
        shell: bash
        env:
          VERSION_VALUE: ${{ steps.promote.outputs.version }}
          TAG_VALUE: ${{ steps.promote.outputs.tag }}
          RELEASE_URL: ${{ steps.promote.outputs.url }}
          ASSET_COUNT: ${{ steps.promote.outputs.asset_count }}
        run: |
          set -Eeuo pipefail
          mkdir -p docs/release
          cat > docs/release/RELEASE_PROMOTION_STATUS.md <<EOF
          # Estado da Release atual

          - Versão: \`$VERSION_VALUE\`
          - Tag: \`$TAG_VALUE\`
          - Release: $RELEASE_URL
          - Tipo: Release normal
          - Draft: false
          - Pre-release: false
          - Latest: true
          - Assets existentes: $ASSET_COUNT
          - Verificação: SUCCESS
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/RELEASE_PROMOTION_STATUS.md
          git commit -m "docs(release): registrar promoção de $TAG_VALUE para Release normal"
          git push origin HEAD:main
