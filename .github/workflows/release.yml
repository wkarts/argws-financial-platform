name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  images:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile
          - name: web
            dockerfile: frontend/Dockerfile
          - name: gateway
            dockerfile: infrastructure/docker/gateway/Dockerfile
          - name: acme
            dockerfile: infrastructure/acme/Dockerfile
          - name: cloudpanel-agent
            dockerfile: infrastructure/cloudpanel-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/argws-financial-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  source:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - name: Package source and deployment bundles
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$version"
          python scripts/package_release.py --output-dir release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/ARGWS-Financial-Platform-v*.zip
            release-artifacts/ARGWS-Financial-Platform-v*.tar.zst
            release-artifacts/ARGWS-Financial-Platform-v*.tar.gz
            release-artifacts/ARGWS-Financial-Platform-v*-SHA256SUMS.txt
            release-artifacts/ARGWS-Financial-Platform-v*-PACKAGE_REPORT.json
            VALIDATION_REPORT.json
            VALIDATION_REPORT.md
