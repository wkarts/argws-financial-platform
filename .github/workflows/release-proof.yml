name: Verify Published Release

on:
  workflow_run:
    workflows: ["Publish Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-published-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify normal/latest Release and assets
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          release_json="$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isDraft,isPrerelease,url,assets)"

          is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          release_url="$(jq -r '.url' <<<"$release_json")"
          assets="$(jq -r '.assets[].name' <<<"$release_json")"
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"

          [[ "$is_draft" == "false" ]] || {
            echo "::error::A publicação $tag está como Draft."
            exit 1
          }
          [[ "$is_prerelease" == "false" ]] || {
            echo "::error::A publicação $tag está como Pre-release."
            exit 1
          }
          [[ "$latest_tag" == "$tag" ]] || {
            echo "::error::A Release latest é $latest_tag, esperado $tag."
            exit 1
          }

          expected=(
            "ARGWS-Financial-Platform-v${version}.zip"
            "ARGWS-Financial-Platform-v${version}.tar.zst"
            "ARGWS-Financial-Platform-v${version}.tar.gz"
            "ARGWS-Financial-Platform-v${version}-SHA256SUMS.txt"
            "ARGWS-Financial-Platform-v${version}-PACKAGE_REPORT.json"
            "ARGWS-Financial-Platform-v${version}-Dockge.zip"
            "CONTAINER_IMAGES.txt"
            "VALIDATION_REPORT.json"
            "VALIDATION_REPORT.md"
          )

          for name in "${expected[@]}"; do
            grep -Fxq "$name" <<<"$assets" || {
              echo "::error::Release existe, mas falta o asset: $name"
              exit 1
            }
          done

          {
            echo "ARGWS Financial Platform"
            echo "Version: $version"
            echo "Tag: $tag"
            echo "Release: $release_url"
            echo "Draft: false"
            echo "Pre-release: false"
            echo "Latest: true"
            echo "Assets verified: ${#expected[@]}"
            echo
            printf '%s\n' "$assets"
          } > RELEASE_PROOF.txt

      - name: Upload release proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ github.event.workflow_run.id }}
          path: RELEASE_PROOF.txt
          if-no-files-found: error
          retention-days: 30
