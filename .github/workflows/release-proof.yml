name: Verify Published Release

on:
  workflow_run:
    workflows: ["Publish Release"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: verify-published-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  record-proof:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify normal/latest Release and assets
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          release_json="$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isDraft,isPrerelease,url,assets)"

          is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          release_url="$(jq -r '.url' <<<"$release_json")"
          assets="$(jq -r '.assets[].name' <<<"$release_json")"
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"

          [[ "$is_draft" == "false" ]] || {
            echo "::error::A publicação $tag está como Draft."
            exit 1
          }
          [[ "$is_prerelease" == "false" ]] || {
            echo "::error::A publicação $tag está como Pre-release."
            exit 1
          }
          [[ "$latest_tag" == "$tag" ]] || {
            echo "::error::A Release latest é $latest_tag, esperado $tag."
            exit 1
          }

          expected=(
            "ARGWS-Financial-Platform-v${version}.zip"
            "ARGWS-Financial-Platform-v${version}.tar.zst"
            "ARGWS-Financial-Platform-v${version}.tar.gz"
            "ARGWS-Financial-Platform-v${version}-SHA256SUMS.txt"
            "ARGWS-Financial-Platform-v${version}-PACKAGE_REPORT.json"
            "ARGWS-Financial-Platform-v${version}-Dockge.zip"
            "CONTAINER_IMAGES.txt"
            "VALIDATION_REPORT.json"
            "VALIDATION_REPORT.md"
          )

          for name in "${expected[@]}"; do
            grep -Fxq "$name" <<<"$assets" || {
              echo "::error::Release existe, mas falta o asset: $name"
              exit 1
            }
          done

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "url=$release_url"
            echo "asset_count=${#expected[@]}"
          } >> "$GITHUB_OUTPUT"

          printf '%s\n' "$assets" > /tmp/release-assets.txt

      - name: Record publication proof in repository
        shell: bash
        env:
          VERSION_VALUE: ${{ steps.verify.outputs.version }}
          TAG_VALUE: ${{ steps.verify.outputs.tag }}
          RELEASE_URL: ${{ steps.verify.outputs.url }}
          ASSET_COUNT: ${{ steps.verify.outputs.asset_count }}
        run: |
          set -Eeuo pipefail
          mkdir -p docs/release

          {
            echo "# Última release publicada e verificada"
            echo
            echo "- Versão: \`$VERSION_VALUE\`"
            echo "- Tag: \`$TAG_VALUE\`"
            echo "- Release: $RELEASE_URL"
            echo "- Tipo: Release normal"
            echo "- Draft: false"
            echo "- Pre-release: false"
            echo "- Latest: true"
            echo "- Assets verificados: $ASSET_COUNT"
            echo "- Workflow de publicação: SUCCESS"
            echo "- Commit publicado: \`${{ github.event.workflow_run.head_sha }}\`"
            echo
            echo "## Assets"
            echo
            while IFS= read -r asset; do
              [[ -n "$asset" ]] && echo "- \`$asset\`"
            done < /tmp/release-assets.txt
          } > docs/release/LAST_PUBLISHED_RELEASE.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/LAST_PUBLISHED_RELEASE.md

          if git diff --cached --quiet; then
            echo "Evidência já está atualizada."
            exit 0
          fi

          git commit -m "docs(release): registrar Release normal verificada de $TAG_VALUE"
          git push origin HEAD:main
