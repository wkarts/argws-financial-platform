name: Verify Published Release

on:
  workflow_run:
    workflows: ["Publish Release"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: verify-published-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  record-proof:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify release object and assets
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          release_json="$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isPrerelease,url,assets)"

          release_url="$(jq -r '.url' <<<"$release_json")"
          assets="$(jq -r '.assets[].name' <<<"$release_json")"

          expected=(
            "ARGWS-Financial-Platform-v${version}.zip"
            "ARGWS-Financial-Platform-v${version}.tar.zst"
            "ARGWS-Financial-Platform-v${version}.tar.gz"
            "ARGWS-Financial-Platform-v${version}-SHA256SUMS.txt"
            "ARGWS-Financial-Platform-v${version}-PACKAGE_REPORT.json"
            "CONTAINER_IMAGES.txt"
            "VALIDATION_REPORT.json"
            "VALIDATION_REPORT.md"
          )

          for name in "${expected[@]}"; do
            grep -Fxq "$name" <<<"$assets" || {
              echo "::error::Release existe, mas falta o asset: $name"
              exit 1
            }
          done

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "url=$release_url"
            echo "asset_count=${#expected[@]}"
          } >> "$GITHUB_OUTPUT"

          printf '%s\n' "$assets" > /tmp/release-assets.txt
      - name: Record publication proof in repository
        shell: bash
        env:
          VERSION_VALUE: ${{ steps.verify.outputs.version }}
          TAG_VALUE: ${{ steps.verify.outputs.tag }}
          RELEASE_URL: ${{ steps.verify.outputs.url }}
          ASSET_COUNT: ${{ steps.verify.outputs.asset_count }}
        run: |
          set -Eeuo pipefail
          mkdir -p docs/release

          {
            echo "# Última release publicada e verificada"
            echo
            echo "- Versão: \`$VERSION_VALUE\`"
            echo "- Tag: \`$TAG_VALUE\`"
            echo "- Release: $RELEASE_URL"
            echo "- Assets verificados: $ASSET_COUNT"
            echo "- Workflow de publicação: SUCCESS"
            echo "- Commit publicado: \`${{ github.event.workflow_run.head_sha }}\`"
            echo
            echo "## Assets"
            echo
            while IFS= read -r asset; do
              [[ -n "$asset" ]] && echo "- \`$asset\`"
            done < /tmp/release-assets.txt
          } > docs/release/LAST_PUBLISHED_RELEASE.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/LAST_PUBLISHED_RELEASE.md

          if git diff --cached --quiet; then
            echo "Evidência já está atualizada."
            exit 0
          fi

          git commit -m "docs(release): registrar publicação verificada de $TAG_VALUE"
          git push origin HEAD:main
