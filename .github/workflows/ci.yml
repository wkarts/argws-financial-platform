name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend --select E9,F63,F7,F82
      - run: python -m compileall -q backend/app
      - run: PYTHONPATH=backend pytest -q backend/tests --cov=app --cov-report=term-missing
      - run: PYTHONPATH=backend python -c "from sqlalchemy.orm import configure_mappers; import app.models.platform, app.models.tenant; configure_mappers(); print('mappers ok')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install PyYAML
      - run: python scripts/validate_project.py
      - run: cp .env.example .env
      - run: python scripts/generate_secrets.py --env .env
      - run: docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, structure]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: argws-financial-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: argws-financial-web:ci
