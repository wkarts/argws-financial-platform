name: CI

on:
  workflow_call:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: ruff check --config backend/pyproject.toml backend scripts
      - run: python -m compileall -q backend/app backend/migrations backend/tests
      - run: PYTHONPATH=backend pytest -q backend/tests --cov=app --cov-report=term-missing --cov-report=xml
      - run: PYTHONPATH=backend python -c "from sqlalchemy.orm import configure_mappers; import app.models.platform, app.models.tenant; configure_mappers(); print('mappers ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install PyYAML SQLAlchemy pydantic pydantic-settings cryptography email-validator
      - run: python scripts/validate_project.py
      - run: python scripts/validate_runtime_contract.py
      - run: python scripts/validate_dockge_runtime.py
      - run: python scripts/package_dockge_stack.py --output-dir /tmp/dockge-package
      - run: test -s "/tmp/dockge-package/ARGWS-Financial-Platform-v$(tr -d '[:space:]' < VERSION)-Dockge.zip"
      - run: cp .env.example .env
      - run: python scripts/generate_secrets.py --env .env
      - name: Prepare deployment env files for compose validation
        run: |
          cp deployments/dockge/.env.example deployments/dockge/.env
          cp deployments/cloudpanel/.env.example deployments/cloudpanel/.env
      - run: mkdir -p data-postgres data-redis data-rabbitmq data-minio data-backups data-runtime data-celery data-acme data-certs data-cloudpanel-agent secrets && touch secrets/rclone.conf secrets/backup-age-identity.txt
      - run: docker compose --env-file .env -f compose.yaml config --quiet
      - run: docker compose --env-file .env -f compose.yaml -f compose.local-build.yaml config --quiet
      - run: docker compose -f deployments/docker/compose.images.yaml --env-file deployments/docker/.env.example config --quiet
      - run: docker compose -f deployments/dockge/compose.yaml --env-file deployments/dockge/.env.example config --quiet
      - run: docker compose -f deployments/cloudpanel/compose.yaml --env-file deployments/cloudpanel/.env.example config --quiet
      - run: docker compose -f deployments/production/compose.yaml --env-file deployments/production/.env.example config --quiet
      - run: docker compose -f deployments/portainer/stack.yaml --env-file deployments/portainer/.env.example config --quiet

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, structure]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile
          - name: web
            dockerfile: frontend/Dockerfile
          - name: gateway
            dockerfile: infrastructure/docker/gateway/Dockerfile
          - name: acme
            dockerfile: infrastructure/acme/Dockerfile
          - name: cloudpanel-agent
            dockerfile: infrastructure/cloudpanel-agent/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: argws-financial-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend, structure]
    timeout-minutes: 25
    env:
      COMPOSE: docker compose --env-file .env -f compose.yaml -f compose.local-build.yaml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare isolated smoke environment
        run: |
          cp .env.example .env
          python scripts/generate_secrets.py --env .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^PUBLIC_SCHEME=.*/PUBLIC_SCHEME=http/' .env
          sed -i 's/^PLATFORM_DOMAIN=.*/PLATFORM_DOMAIN=localhost/' .env
          sed -i 's/^CONTROL_PLANE_HOST=.*/CONTROL_PLANE_HOST=control.localhost/' .env
          sed -i 's/^API_HOST=.*/API_HOST=api.localhost/' .env
          sed -i 's/^TENANT_DOMAIN_ROOT=.*/TENANT_DOMAIN_ROOT=localhost/' .env
          sed -i 's/^TRUSTED_HOSTS=.*/TRUSTED_HOSTS=localhost,127.0.0.1,.localhost/' .env
          sed -i 's/^CORS_ORIGINS=.*/CORS_ORIGINS=http:\/\/localhost:8800,http:\/\/control.localhost:8800,http:\/\/demo.localhost:8800/' .env
          sed -i 's/^GATEWAY_BIND_IP=.*/GATEWAY_BIND_IP=127.0.0.1/' .env
          sed -i 's/^GATEWAY_PORT=.*/GATEWAY_PORT=8800/' .env
          sed -i 's/^PROVISIONING_ASYNC=.*/PROVISIONING_ASYNC=false/' .env
          sed -i 's/^BOOTSTRAP_DEMO_TENANT=.*/BOOTSTRAP_DEMO_TENANT=true/' .env
          mkdir -p data-postgres data-redis data-rabbitmq data-minio data-backups data-runtime data-celery secrets
          touch secrets/rclone.conf secrets/backup-age-identity.txt
      - name: Build local model and start platform
        run: $COMPOSE up -d --build --remove-orphans
      - name: Verify only gateway publishes a host port
        run: |
          published="$($COMPOSE ps --format json | jq -r 'select(any(.Publishers[]?; (.PublishedPort // 0) != 0)) | .Service' | sort -u)"
          test "$published" = "financial-gateway" || {
            echo "Unexpected host publishers: $published"
            $COMPOSE ps
            exit 1
          }
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS -H 'Host: api.localhost' http://127.0.0.1:8800/health/ready; then
              exit 0
            fi
            sleep 5
          done
          $COMPOSE ps
          $COMPOSE logs --tail=300
          exit 1
      - name: Smoke tenant and Control Plane hosts
        run: |
          curl -fsS -H 'Host: api.localhost' http://127.0.0.1:8800/health/live
          curl -fsS -H 'Host: control.localhost' http://127.0.0.1:8800/ >/dev/null
          curl -fsS -H 'Host: demo.localhost' http://127.0.0.1:8800/ >/dev/null
      - name: Verify Celery workers stay compatible with RabbitMQ 4
        run: |
          sleep 5
          running="$($COMPOSE ps --status running --services)"
          for service in financial-worker-default financial-worker-billing financial-worker-notifications financial-worker-backups financial-beat; do
            grep -Fxq "$service" <<<"$running" || {
              echo "Worker/beat não permaneceu em execução: $service"
              $COMPOSE ps
              $COMPOSE logs --no-color --tail=200 "$service"
              exit 1
            }
          done
          logs="$($COMPOSE logs --no-color --tail=300 financial-worker-default financial-worker-billing financial-worker-notifications financial-worker-backups financial-beat financial-rabbitmq)"
          if grep -q 'transient_nonexcl_queues' <<<"$logs"; then
            echo "Celery ainda acionou filas transitórias incompatíveis com RabbitMQ 4"
            printf '%s\n' "$logs"
            exit 1
          fi
          if grep -q 'PermissionError.*celerybeat-schedule' <<<"$logs"; then
            echo "Celery Beat não conseguiu gravar o arquivo de schedule"
            printf '%s\n' "$logs"
            exit 1
          fi
      - name: Container status
        run: $COMPOSE ps
      - name: Collect logs on failure
        if: failure()
        run: $COMPOSE logs --tail=500
      - name: Shutdown
        if: always()
        run: $COMPOSE down --remove-orphans
