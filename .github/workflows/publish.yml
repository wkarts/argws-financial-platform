name: Publish Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve canonical version
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Versão inválida em VERSION: $version"
            exit 1
          }
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  validate:
    uses: ./.github/workflows/ci.yml

  images:
    runs-on: ubuntu-latest
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile
          - name: web
            dockerfile: frontend/Dockerfile
          - name: gateway
            dockerfile: infrastructure/docker/gateway/Dockerfile
          - name: acme
            dockerfile: infrastructure/acme/Dockerfile
          - name: cloudpanel-agent
            dockerfile: infrastructure/cloudpanel-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/argws-financial-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=sha
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=publish-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.name }}
      - name: Verify published image tags
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${{ github.repository_owner }}/argws-financial-${{ matrix.name }}"
          docker buildx imagetools inspect "$image:latest" >/dev/null
          docker buildx imagetools inspect "$image:${{ needs.prepare.outputs.version }}" >/dev/null
          echo "Publicado e verificado: $image:latest"
          echo "Alias imutável: $image:${{ needs.prepare.outputs.version }}"

  artifacts-and-release:
    runs-on: ubuntu-latest
    needs: [prepare, validate, images]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation and packaging dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install PyYAML SQLAlchemy pydantic pydantic-settings cryptography email-validator
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Validate and package release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "$RELEASE_VERSION"
          python scripts/validate_project.py
          python scripts/package_release.py --output-dir release-artifacts --skip-validation

          cat > release-artifacts/CONTAINER_IMAGES.txt <<EOF
          ARGWS Financial Platform ${RELEASE_VERSION}

          Runtime (sempre latest):
          ghcr.io/${{ github.repository_owner }}/argws-financial-api:latest
          ghcr.io/${{ github.repository_owner }}/argws-financial-web:latest
          ghcr.io/${{ github.repository_owner }}/argws-financial-gateway:latest
          ghcr.io/${{ github.repository_owner }}/argws-financial-acme:latest
          ghcr.io/${{ github.repository_owner }}/argws-financial-cloudpanel-agent:latest

          Aliases imutáveis da release para auditoria/rollback:
          ghcr.io/${{ github.repository_owner }}/argws-financial-api:${RELEASE_VERSION}
          ghcr.io/${{ github.repository_owner }}/argws-financial-web:${RELEASE_VERSION}
          ghcr.io/${{ github.repository_owner }}/argws-financial-gateway:${RELEASE_VERSION}
          ghcr.io/${{ github.repository_owner }}/argws-financial-acme:${RELEASE_VERSION}
          ghcr.io/${{ github.repository_owner }}/argws-financial-cloudpanel-agent:${RELEASE_VERSION}
          EOF

          test -s "release-artifacts/ARGWS-Financial-Platform-v${RELEASE_VERSION}.zip"
          test -s "release-artifacts/ARGWS-Financial-Platform-v${RELEASE_VERSION}.tar.zst"
          test -s "release-artifacts/ARGWS-Financial-Platform-v${RELEASE_VERSION}.tar.gz"
          test -s "release-artifacts/ARGWS-Financial-Platform-v${RELEASE_VERSION}-SHA256SUMS.txt"
          test -s "release-artifacts/ARGWS-Financial-Platform-v${RELEASE_VERSION}-PACKAGE_REPORT.json"
      - name: Upload GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARGWS-Financial-Platform-${{ needs.prepare.outputs.version }}
          path: |
            release-artifacts/*
            RELEASE_NOTES.md
            VALIDATION_REPORT.json
            VALIDATION_REPORT.md
          if-no-files-found: error
          retention-days: 30
      - name: Repair version tag when Release is missing
        shell: bash
        run: |
          set -Eeuo pipefail

          # Uma tag sem objeto GitHub Release é estado parcial e pode ser reparada.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release já existe; a tag não será movida."
            exit 0
          fi

          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            current_target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$current_target" != "$GITHUB_SHA" ]]; then
              echo "Reparando tag órfã $RELEASE_TAG: $current_target -> $GITHUB_SHA"
              git tag -fa "$RELEASE_TAG" "$GITHUB_SHA" -m "ARGWS Financial Platform $RELEASE_TAG"
              git push --force origin "refs/tags/$RELEASE_TAG"
            fi
          else
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "ARGWS Financial Platform $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Create or repair GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail

          assets=(
            "release-artifacts/ARGWS-Financial-Platform-v${RELEASE_VERSION}.zip"
            "release-artifacts/ARGWS-Financial-Platform-v${RELEASE_VERSION}.tar.zst"
            "release-artifacts/ARGWS-Financial-Platform-v${RELEASE_VERSION}.tar.gz"
            "release-artifacts/ARGWS-Financial-Platform-v${RELEASE_VERSION}-SHA256SUMS.txt"
            "release-artifacts/ARGWS-Financial-Platform-v${RELEASE_VERSION}-PACKAGE_REPORT.json"
            "release-artifacts/CONTAINER_IMAGES.txt"
            "VALIDATION_REPORT.json"
            "VALIDATION_REPORT.md"
          )

          for asset in "${assets[@]}"; do
            [[ -s "$asset" ]] || {
              echo "::error::Artefato ausente ou vazio: $asset"
              exit 1
            }
          done

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(
              release create "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --title "ARGWS Financial Platform $RELEASE_TAG"
              --notes-file RELEASE_NOTES.md
            )
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            else
              args+=(--latest)
            fi
            gh "${args[@]}"
          fi

          # O upload é separado da criação do Release para que a operação seja idempotente
          # e possa reparar uma publicação parcial com a mesma VERSION/tag.
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Verify GitHub Release and every published asset
        shell: bash
        run: |
          set -Eeuo pipefail

          expected=(
            "ARGWS-Financial-Platform-v${RELEASE_VERSION}.zip"
            "ARGWS-Financial-Platform-v${RELEASE_VERSION}.tar.zst"
            "ARGWS-Financial-Platform-v${RELEASE_VERSION}.tar.gz"
            "ARGWS-Financial-Platform-v${RELEASE_VERSION}-SHA256SUMS.txt"
            "ARGWS-Financial-Platform-v${RELEASE_VERSION}-PACKAGE_REPORT.json"
            "CONTAINER_IMAGES.txt"
            "VALIDATION_REPORT.json"
            "VALIDATION_REPORT.md"
          )

          release_assets="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')"

          for name in "${expected[@]}"; do
            grep -Fxq "$name" <<<"$release_assets" || {
              echo "::error::Asset não publicado no GitHub Release: $name"
              exit 1
            }
          done

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isPrerelease,url,assets

          echo "Release $RELEASE_TAG publicada e verificada com ${#expected[@]} assets."
