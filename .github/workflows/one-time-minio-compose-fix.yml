name: One-time MinIO Compose Fix

on:
  push:
    branches:
      - 'feat(financial)/initial'
    paths:
      - '.github/workflows/one-time-minio-compose-fix.yml'

permissions:
  contents: write

jobs:
  patch-compose-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'feat(financial)/initial'
          fetch-depth: 0

      - name: Corrigir execução do MinIO Client
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('compose.yaml'),
              Path('deployments/cloudpanel/compose.yaml'),
              Path('deployments/dockge/compose.yaml'),
              Path('deployments/docker/compose.images.yaml'),
              Path('deployments/docker/compose.production.yaml'),
              Path('deployments/portainer/stack.yaml'),
              Path('deployments/production/compose.yaml'),
              Path('deployments/portainer/stack-build.yaml'),
          ]

          old = '''    entrypoint: ["/bin/sh", "-ec"]
              command: |
                mc alias set local http://financial-minio:9000 "${MINIO_ROOT_USER:-financial}" "${MINIO_ROOT_PASSWORD}";
                mc mb --ignore-existing "local/${BACKUP_S3_BUCKET:-financial-backups}";
                mc anonymous set none "local/${BACKUP_S3_BUCKET:-financial-backups}";
          '''

          new = '''    entrypoint:
                - /bin/sh
                - -ec
                - |
                    mc alias set local http://financial-minio:9000 "${MINIO_ROOT_USER:-financial}" "${MINIO_ROOT_PASSWORD}"
                    mc mb --ignore-existing "local/${BACKUP_S3_BUCKET:-financial-backups}"
                    mc anonymous set none "local/${BACKUP_S3_BUCKET:-financial-backups}"
          '''

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              occurrences = text.count(old)
              if occurrences != 1:
                  raise SystemExit(f'{path}: esperado 1 bloco MinIO, encontrado {occurrences}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed.append(str(path))

          print('Arquivos corrigidos:')
          print('\n'.join(f'- {item}' for item in changed))
          PY

      - name: Validar os arquivos Compose corrigidos
        shell: bash
        run: |
          cp .env.example .env
          python3 scripts/generate_secrets.py --env .env
          docker compose --env-file .env -f compose.yaml config --quiet
          docker compose --env-file deployments/docker/.env.example -f deployments/docker/compose.images.yaml config --quiet
          docker compose --env-file deployments/dockge/.env.example -f deployments/dockge/compose.yaml config --quiet
          docker compose --env-file deployments/cloudpanel/.env.example -f deployments/cloudpanel/compose.yaml config --quiet
          docker compose --env-file deployments/portainer/.env.example -f deployments/portainer/stack.yaml config --quiet
          docker compose --env-file deployments/portainer/.env.example -f deployments/portainer/stack-build.yaml config --quiet

      - name: Publicar correção e remover workflow temporário
        shell: bash
        run: |
          rm -f .github/workflows/one-time-minio-compose-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compose.yaml deployments .github/workflows/one-time-minio-compose-fix.yml
          git commit -m 'fix(docker): corrigir inicialização do MinIO Client em todas as stacks'
          git push origin HEAD:'feat(financial)/initial'
